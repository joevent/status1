<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e141a">
<meta name="description" content="Status 1 – anonymes 2-Minuten-Debrief für Rettungsdienst-Besatzungen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Status 1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Status 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: single-column phone tool read aloud in the vehicle; sticky bar with timer, FMS-key motif, big tap targets */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e2e7ec; --fg:#14202b; --muted:#56636f; --line:#cbd3db;
  --accent:#d4441b; --accent-fg:#ffffff;
  --pos:#1d8552; --pos-bg:#dcf1e5; --neg:#a96200; --neg-bg:#fbe8c6;
  --key:#1b2631; --key-fg:#f3f6f9; --key-edge:#0b1117;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#16202a; --surface-2:#1f2a36; --fg:#e6ecf1; --muted:#93a2b0; --line:#2b3846;
    --accent:#ff6c3e; --accent-fg:#1b0c06;
    --pos:#4fca8c; --pos-bg:#14342a; --neg:#f1ad4b; --neg-bg:#3a2a12;
    --key:#e6ecf1; --key-fg:#0e141a; --key-edge:#9aa8b5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#16202a; --surface-2:#1f2a36; --fg:#e6ecf1; --muted:#93a2b0; --line:#2b3846;
  --accent:#ff6c3e; --accent-fg:#1b0c06;
  --pos:#4fca8c; --pos-bg:#14342a; --neg:#f1ad4b; --neg-bg:#3a2a12;
  --key:#e6ecf1; --key-fg:#0e141a; --key-edge:#9aa8b5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em}
.key{display:inline-grid;place-items:center;background:var(--key);color:var(--key-fg);font-family:var(--display);font-weight:700;border-radius:8px;box-shadow:inset 0 -3px 0 var(--key-edge)}
.key.s{width:32px;height:32px;font-size:22px}
.timer{font-family:var(--display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:5ch;text-align:right}
.timer.over{color:var(--neg)}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin:-12px 0 20px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s linear}

/* type */
h1,h2{font-family:var(--display);font-weight:700;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:44px;letter-spacing:.01em}
h2{font-size:34px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:19px;color:var(--muted);margin:0}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;color:var(--muted)}
.hint strong{color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.small{font-size:14px;color:var(--muted)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:18px;width:100%;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:24px;letter-spacing:.02em}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--neg);color:var(--neg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{font-family:var(--body);font-weight:500;font-size:15px;opacity:.85}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.tile b{font-size:17px}
.tile span{font-size:14px;color:var(--muted)}

/* hero */
.hero{display:flex;gap:18px;align-items:center;margin-block:8px 6px}
.key.xl{width:96px;height:96px;font-size:74px;border-radius:18px;box-shadow:inset 0 -7px 0 var(--key-edge);flex:none}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted)}

/* question */
.q{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05;text-wrap:balance}
.readaloud{display:flex;gap:8px;align-items:center}
.tag-read{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--surface-2);border-radius:6px;padding:3px 8px;color:var(--muted)}

/* chips */
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:8px 12px;text-align:left;font-weight:500;font-size:16px;line-height:1.2;display:flex;align-items:center;gap:8px}
.chip::before{content:"";width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid var(--line)}
.mode-pos .chip[aria-pressed="true"]{background:var(--pos-bg);border-color:var(--pos)}
.mode-pos .chip[aria-pressed="true"]::before{background:var(--pos);border-color:var(--pos)}
.mode-neg .chip[aria-pressed="true"]{background:var(--neg-bg);border-color:var(--neg)}
.mode-neg .chip[aria-pressed="true"]::before{background:var(--neg);border-color:var(--neg)}
.chip.cat[aria-pressed="true"]{border-color:var(--fg);background:var(--surface-2)}
.chip.cat[aria-pressed="true"]::before{background:var(--fg);border-color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;border-radius:999px;padding:3px 10px}
.badge.pos{background:var(--pos-bg);color:var(--pos)}
.badge.neg{background:var(--neg-bg);color:var(--neg)}

textarea{width:100%;min-height:96px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:12px;font-size:17px;resize:vertical}
input[type=password],input[type=text]{width:100%;min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-size:22px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
label.check{display:flex;gap:10px;align-items:center;font-size:16px}
label.check input{width:22px;height:22px;accent-color:var(--accent)}

/* rules card */
.rules{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-family:var(--display);font-size:24px;margin:0 0 8px}
.card ul{margin:0;padding-left:20px;display:grid;gap:6px}
.www{display:grid;gap:8px;margin:10px 0}
.www div{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start}
.www b{font-family:var(--display);font-size:26px;line-height:1;color:var(--accent)}
.www em{font-style:normal;color:var(--muted);display:block;font-size:15px}

/* stats */
.stat-head{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.num b{display:block;font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.num span{font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--surface);font-size:15px;font-weight:600;padding:6px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.bars{display:grid;gap:12px}
.barrow{display:grid;gap:4px}
.barrow .lbl{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.barrow .lbl span{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.barrow .lbl span .p{color:var(--pos);font-weight:600}
.barrow .lbl span .n{color:var(--neg);font-weight:600}
.track{height:12px;background:var(--surface-2);border-radius:6px;display:flex;overflow:hidden}
.track .p{background:var(--pos)}
.track .n{background:var(--neg)}
.zero{opacity:.5}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lessons{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lessons li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.lessons li p{margin:0;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;flex:none}
.s0{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:12px;padding:12px 14px}
.s0 b{font-size:17px}
.s0 small{color:var(--muted);font-size:14px}
.key.s0k{width:40px;height:40px;font-size:28px;background:var(--accent);color:var(--accent-fg);box-shadow:none;flex:none}
.demo{background:var(--neg-bg);color:var(--neg);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.err{color:var(--accent);font-size:15px;font-weight:600}

/* done */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:24px}
.key.glow{width:140px;height:140px;font-size:108px;border-radius:24px;box-shadow:inset 0 -9px 0 var(--key-edge),0 0 0 8px color-mix(in srgb,var(--pos) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .key.glow{animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
}
@media (max-width:380px){h1{font-size:38px}.q{font-size:32px}.key.xl{width:80px;height:80px;font-size:60px}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
const TAGS=[
 {g:"Team",items:[["kom","Kommunikation"],["fue","Führung & Entscheidung"],["spk","Bedenken ansprechen"]]},
 {g:"Ablauf",items:[["anf","Anfahrt & Navigation"],["lag","Lageeinschätzung"],["mat","Material & Gerät"],["med","Medikamente"],["zei","Zeitmanagement"],["dok","Dokumentation"]]},
 {g:"Schnittstellen",items:[["lst","Leitstelle"],["nef","Notarzt / NEF"],["fwp","Feuerwehr / Polizei"],["kla","Klinik-Anmeldung"],["zna","ZNA-Übergabe"],["rmt","Weitere Rettungsmittel (RTW, RTH)"]]},
 {g:"Mensch",items:[["mue","Müdigkeit"],["str","Stress & Schreckmoment"],["eig","Eigenschutz"]]}
];
const TAGNAME={},TAGGROUP={};
TAGS.forEach(g=>g.items.forEach(([id,n])=>{TAGNAME[id]=n;TAGGROUP[id]=g.g}));
const CATS=["Internistisch","Trauma","Reanimation","Kind","Transport","Sonstiges"];
const KEY="status1.v1";

function blank(){return{counts:{},debriefs:0,cats:{},lessons:[],board:[],demo:false,settings:{askCat:false,pin:"0000"}}}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const b=blank();return Object.assign(b,o,{settings:Object.assign(b.settings,o.settings||{})})}}catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
let db=load();

const app=document.getElementById("app");
let view="home", run=null, unlocked=false, sortMode="neg", ui={};
let wake=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(sec){const s=Math.abs(Math.round(sec));return (sec<0?"+":"")+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function lockScreen(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wake=l).catch(()=>{})}catch(e){}}
function unlockScreen(){try{wake&&wake.release()}catch(e){}wake=null}

function steps(){const s=["checkin","pos","neg","take"];if(db.settings.askCat)s.push("cat");s.push("feedback");return s}

const PROMPTS={
 checkin:{q:"Ist für alle alles okay?",kurz:"Kurz in die Runde fragen. Eine ehrliche Antwort reicht, niemand muss etwas begründen.",lang:"Ruhig einen Moment Pause lassen. Wer nicht reden möchte, muss nicht."},
 pos:{q:"Was lief gut?",kurz:"Jeder nennt einen Punkt. Tippt an, wozu er gehört.",lang:"Was genau hat gut funktioniert, und warum? Wer hat was beigetragen? Was davon wollen wir beibehalten?"},
 neg:{q:"Was machen wir nächstes Mal besser?",kurz:"Es geht um Abläufe, nicht um Schuld. „Ich“-Sätze statt „du hast“.",lang:"Wo wurde es eng? Was hätte geholfen? Lag es an uns oder an einer Schnittstelle? Was war überraschend?"},
 take:{q:"Was nehmen wir mit?",kurz:"Ein Satz, den ihr beim nächsten Einsatz anders oder genauso macht. Ist am Fahrzeug etwas defekt oder fehlt etwas? Dann als Hinweis für die nächste Besatzung notieren.",lang:"Einigt euch auf einen Punkt. Lieber eine konkrete Sache als drei allgemeine. Defekte oder fehlendes Material als Hinweis zum Fahrzeug notieren."},
 cat:{q:"Welche Einsatzart?",kurz:"Freiwillig. Hilft der Wache bei der Auswertung. Ihr könnt diesen Schritt überspringen.",lang:"Freiwillig. Hilft der Wache bei der Auswertung. Ihr könnt diesen Schritt überspringen."},
 feedback:{q:"Noch eine Minute für Feedback?",kurz:"Optional. Jeder sagt dem anderen einen Punkt, nach den Regeln unten.",lang:"Jeder gibt dem anderen ein Feedback: zuerst etwas Gutes, dann ein Wunsch."}
};

function bar(){
  let right="";
  if(view==="flow"&&run){right=`<div class="timer" id="timer" aria-live="off"></div>`}
  return `<header class="bar"><button class="brand" data-a="home" aria-label="Zur Startseite"><span class="key s">1</span><b>Status 1</b></button>${right}</header>`+
   (view==="flow"&&run?`<div class="progress"><i id="prog"></i></div>`:"");
}

function chipGrid(sel,mode){
  return `<div class="stack mode-${mode}">`+TAGS.map(g=>`<div class="group"><div class="eyebrow">${g.g}</div><div class="chips">`+
   g.items.map(([id,n])=>`<button class="chip" data-a="tag" data-id="${id}" data-mode="${mode}" aria-pressed="${sel.has(id)}">${n}</button>`).join("")+
   `</div></div>`).join("")+`</div>`;
}

function rulesCard(){
  return `<div class="rules">
   <div class="card"><h3>Feedback geben</h3>
    <ul><li>Mit etwas Positivem beginnen.</li></ul>
    <div class="www">
     <div><b>W</b><span><strong>Wahrnehmung</strong><em>„Mir ist aufgefallen, dass …“</em></span></div>
     <div><b>W</b><span><strong>Wirkung</strong><em>„Das hat bei mir … ausgelöst.“</em></span></div>
     <div><b>W</b><span><strong>Wunsch</strong><em>„Ich würde mir wünschen, dass …“</em></span></div>
    </div>
    <ul>
     <li>Ich-Botschaften statt „man“ oder „du immer“.</li>
     <li>Beschreiben, nicht bewerten: das Verhalten, nicht die Person.</li>
     <li>Konkret und zeitnah. Nur ansprechen, was sich ändern lässt.</li>
     <li>Kurz halten.</li>
    </ul></div>
   <div class="card"><h3>Feedback nehmen</h3>
    <ul>
     <li>Zuhören und ausreden lassen.</li>
     <li>Nicht rechtfertigen oder verteidigen.</li>
     <li>Bei Unklarheit nachfragen.</li>
     <li>Bedanken. Was du annimmst, entscheidest du selbst.</li>
    </ul></div>
  </div>`;
}

function vHome(){
  return `<div class="stack">
   ${(db.board||[]).length?`<button class="s0" data-a="go" data-v="wall"><span class="key s0k">!</span><span><b>Dringender Sprechwunsch: ${db.board.length===1?"1 Hinweis":db.board.length+" Hinweise"} für euch</b><br><small>Vor dem nächsten Einsatz kurz lesen</small></span></button>`:""}
   <div class="hero"><span class="key xl" aria-hidden="true">1</span>
    <div class="stack" style="gap:6px"><h1>Erst Debrief, dann Status 1.</h1></div></div>
   <p class="lead">Zwei Minuten auf der Rückfahrt. Wer nicht fährt, liest vor. Die App gibt die Fragen und die Zeit vor.</p>
   <div class="facts"><span class="fact">Anonym</span><span class="fact">Ohne Uhrzeit</span><span class="fact">Ohne Namen &amp; Patientendaten</span><span class="fact">Nur auf diesem Gerät</span></div>
   <button class="btn primary" data-a="start" data-mode="kurz">Debrief starten <small>2 Min.</small></button>
   <div class="two">
    <button class="btn" data-a="start" data-mode="lang">Ausführlich<br><small>5 Min. an der Wache</small></button>
    <button class="btn warn" data-a="go" data-v="heavy">Belastender<br>Einsatz</button>
   </div>
   <div class="linkrow">
    <button class="tile" data-a="go" data-v="wall"><b>Dringender Sprechwunsch</b><span>${(db.board||[]).length} ${(db.board||[]).length===1?"Hinweis":"Hinweise"} für die nächste Besatzung</span></button>
    <button class="tile" data-a="go" data-v="rules"><b>Feedback-Regeln</b><span>Geben &amp; nehmen</span></button>
    <button class="tile" data-a="go" data-v="stats"><b>Auswertung</b><span>Für Wachenleitung, mit PIN</span></button>
    <button class="tile" data-a="go" data-v="settings"><b>Einstellungen</b><span>Einsatzart, PIN</span></button>
   </div>
   <p class="small">Version 0.1 · Alle Daten bleiben auf diesem Gerät.</p>
  </div>`;
}

function vHeavy(){
  return `<div class="stack">
   <div class="eyebrow">Belastender Einsatz</div>
   <h2>Erst um euch kümmern.</h2>
   <div class="card"><ul>
    <li>Fragt, wie es dem anderen geht. Zuhören reicht, analysieren müsst ihr jetzt nichts.</li>
    <li>Niemand muss über Gefühle reden. Wer reden möchte, soll die Möglichkeit haben.</li>
    <li>Gebt der Wachenleitung Bescheid, wenn ihr eine Pause braucht.</li>
    <li>Die Einsatznachsorge (PSNV-E) erreicht ihr über eure Leitstelle oder Wachenleitung. Sie ist für genau solche Einsätze da.</li>
   </ul></div>
   <div class="hint">Dieses Debrief ist kein Ersatz für Einsatznachsorge. Es geht nur um den Ablauf und die Zusammenarbeit, und auch das kann warten.</div>
   <button class="btn" data-a="start" data-mode="kurz">Kurzes Debrief zum Ablauf</button>
   <button class="btn ghost" data-a="home">Zurück</button>
  </div>`;
}

function vFlow(){
  const st=steps(), key=st[run.step], P=PROMPTS[key], mod=run.mode==="lang"?P.lang:P.kurz;
  const n=run.step+1, total=st.length;
  let body="", next=`<button class="btn primary" data-a="next">Weiter</button>`;
  if(key==="checkin"){
    body=run.help?`<div class="card"><h3>Gut, dass ihr darauf achtet.</h3><ul>
      <li>Sprecht es jetzt an oder nach der Rückkehr auf der Wache.</li>
      <li>Wachenleitung informieren, wenn eine Pause nötig ist.</li>
      <li>Einsatznachsorge (PSNV-E) über Leitstelle oder Wachenleitung.</li>
      <li>Nichts davon wird hier gespeichert.</li></ul></div>`:"";
    next=run.help?`<button class="btn primary" data-a="next">Weiter zum Debrief</button>`:
      `<div class="stack" style="gap:10px"><button class="btn primary" data-a="next">Ja, alle okay</button><button class="btn" data-a="help">Jemand braucht noch etwas</button></div>`;
  }else if(key==="pos"){
    body=`<span class="badge pos">Wird als „lief gut“ gezählt</span>`+chipGrid(run.pos,"pos");
  }else if(key==="neg"){
    body=`<span class="badge neg">Wird als „besser machen“ gezählt</span>`+chipGrid(run.neg,"neg");
  }else if(key==="take"){
    body=`<div class="stack" style="gap:8px">
      <label for="lesson" class="eyebrow">Für die nächste Besatzung notieren (freiwillig)</label>
      <div class="seg" role="group" aria-label="Art des Eintrags">
       <button data-a="ntype" data-t="lehre" aria-pressed="${run.noteType==="lehre"}">Lehre aus dem Einsatz</button>
       <button data-a="ntype" data-t="fzg" aria-pressed="${run.noteType==="fzg"}">Hinweis zum Fahrzeug</button>
      </div>
      <textarea id="lesson" maxlength="140" placeholder="${run.noteType==="fzg"?"z. B. Absaugpumpe lädt nicht, Ersatzgerät im Fach links.":"z. B. Bei unklarer Lage früher Notarzt nachfordern."}">${esc(run.lesson)}</textarea>
      <div class="small"><span id="cnt">${run.lesson.length}</span>/140 · ${run.noteType==="fzg"?"Steht für die nächsten Besatzungen unter „Dringender Sprechwunsch“, bis jemand ihn als erledigt löscht, z. B. wenn der Defekt behoben ist.":"Steht für die nächsten Besatzungen unter „Dringender Sprechwunsch“ und bleibt anonym in der Auswertung der Wache, auch wenn sie dort entfernt wird."} Keine Namen, keine Patientendaten, keine Orte. Leer lassen geht auch.</div>
     </div>`;
  }else if(key==="cat"){
    body=`<div class="chips">`+CATS.map(c=>`<button class="chip cat" data-a="cat" data-c="${c}" aria-pressed="${run.cat===c}">${c}</button>`).join("")+`</div>`;
    next=`<button class="btn primary" data-a="next">${run.cat?"Weiter":"Überspringen"}</button>`;
  }else if(key==="feedback"){
    body=run.showRules?rulesCard():`<button class="btn" data-a="rulesShow">Feedback-Regeln zeigen</button>`;
    next=`<button class="btn primary" data-a="finish">Abschließen</button>`;
  }
  return `<div class="stack">
   <div class="eyebrow">Schritt ${n} von ${total}${run.mode==="lang"?" · Ausführlich":""}</div>
   <div class="readaloud"><span class="tag-read">Vorlesen</span></div>
   <div class="q">${P.q}</div>
   <div class="hint">${mod}</div>
   ${body}
   ${next}
   ${run.step>0?`<button class="btn ghost" data-a="back">Zurück</button>`:`<button class="btn ghost" data-a="abort">Abbrechen</button>`}
  </div>`;
}

function vDone(){
  const r=ui.last||{p:0,n:0,l:false};
  return `<div class="done">
   <span class="key glow" aria-hidden="true">1</span>
   <h1>Status 1.</h1>
   <p class="lead">Debrief erledigt. Wieder einsatzbereit.</p>
   <div class="row" style="justify-content:center">
    <span class="badge pos">${r.p} × lief gut</span><span class="badge neg">${r.n} × besser machen</span>${r.l?`<span class="badge" style="background:var(--surface-2)">1 Hinweis für die nächste Besatzung</span>`:""}
   </div>
   <p class="small">Gespeichert wurden nur die Schlagworte, ohne Uhrzeit und ohne Namen.</p>
   <button class="btn primary" data-a="home">Fertig</button>
  </div>`;
}

function vWall(){
  const B=db.board||[];
  const item=(e,i)=>`<li><p><span class="badge ${e.k==="fzg"?"neg":"pos"}">${e.k==="fzg"?"Fahrzeug":"Lehre"}</span><br>${esc(e.t)}</p><button class="x" data-a="delb" data-i="${i}">${e.k==="fzg"?"Erledigt":"Entfernen"}</button></li>`;
  return `<div class="stack">
   <div class="readaloud"><span class="key s" style="background:var(--accent);color:var(--accent-fg);box-shadow:none">!</span><span class="eyebrow">Für die nächste Besatzung</span></div>
   <h2>Dringender Sprechwunsch</h2>
   <p class="lead">Was frühere Besatzungen auf diesem Fahrzeug weitergeben: Lehren aus Einsätzen und Hinweise zum Fahrzeug, ohne Datum und ohne Namen. Entfernte Lehren bleiben anonym in der Auswertung der Wache.</p>
   ${B.length?`<ul class="lessons">${B.map(item).join("")}</ul>`:`<div class="hint">Gerade keine Hinweise. Neue Einträge kommen aus dem Debrief oder direkt von hier.</div>`}
   <div class="card stack" style="gap:8px"><h3>Hinweis hinzufügen</h3>
    <div class="seg" role="group" aria-label="Art des Eintrags">
     <button data-a="wtype" data-t="fzg" aria-pressed="${ui.wtype!=="lehre"}">Hinweis zum Fahrzeug</button>
     <button data-a="wtype" data-t="lehre" aria-pressed="${ui.wtype==="lehre"}">Lehre</button>
    </div>
    <textarea id="wnote" maxlength="140" placeholder="z. B. Absaugpumpe lädt nicht, Ersatzgerät im Fach links."></textarea>
    <div class="small">Keine Namen, keine Patientendaten. Entfernen kann jede Besatzung, z. B. wenn ein Defekt behoben ist.</div>
    <button class="btn" data-a="addw">Hinzufügen</button>
   </div>
   <button class="btn ghost" data-a="home">Zurück</button></div>`;
}

function vRules(){return `<div class="stack"><div class="eyebrow">Feedback-Regeln</div><h2>Feedback, das ankommt</h2>${rulesCard()}<button class="btn ghost" data-a="home">Zurück</button></div>`}

function vPin(){
  return `<div class="stack">
   <div class="eyebrow">Auswertung</div><h2>PIN eingeben</h2>
   <p class="lead">Die Auswertung ist für Wachenleitung oder Qualitätsmanagement gedacht.</p>
   <input type="password" id="pin" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN">
   ${ui.pinErr?`<div class="err">Falsche PIN. Bitte erneut versuchen.</div>`:""}
   <button class="btn primary" data-a="pinok">Öffnen</button>
   <p class="small">Prototyp: Standard-PIN 0000, änderbar unter Einstellungen.</p>
   <button class="btn ghost" data-a="home">Zurück</button></div>`;
}

function csv(){
  let s="Schlagwort;Bereich;lief gut;besser machen\n";
  TAGS.forEach(g=>g.items.forEach(([id,n])=>{const c=db.counts[id]||{pos:0,neg:0};s+=`${n};${g.g};${c.pos};${c.neg}\n`}));
  s+=`\nDebriefs gesamt;${db.debriefs}\n`;
  const cats=Object.keys(db.cats);if(cats.length){s+="\nEinsatzart;Anzahl\n";cats.forEach(c=>s+=`${c};${db.cats[c]}\n`)}
  if(db.lessons.length){s+="\nLehren\n";db.lessons.forEach(l=>s+=`"${l.replace(/"/g,'""')}"\n`)}
  return s;
}

function vStats(){
  if(!unlocked)return vPin();
  let rows=[];TAGS.forEach(g=>g.items.forEach(([id,n],i)=>{const c=db.counts[id]||{pos:0,neg:0};rows.push({id,n,g:g.g,p:c.pos,m:c.neg,o:rows.length})}));
  const tp=rows.reduce((a,r)=>a+r.p,0), tn=rows.reduce((a,r)=>a+r.m,0);
  const max=Math.max(1,...rows.map(r=>r.p+r.m));
  if(sortMode==="neg")rows.sort((a,b)=>b.m-a.m||b.p-a.p);
  else if(sortMode==="pos")rows.sort((a,b)=>b.p-a.p||a.m-b.m);
  else rows.sort((a,b)=>a.o-b.o);
  const cats=Object.keys(db.cats);
  return `<div class="stack">
   <div class="eyebrow">Auswertung · dieses Gerät</div><h2>Wo es läuft und wo es hakt</h2>
   ${db.demo?`<div class="demo">Beispieldaten zur Ansicht. Über „Zurücksetzen“ entfernen.</div>`:""}
   <div class="stat-head">
    <div class="num"><b>${db.debriefs}</b><span>Debriefs</span></div>
    <div class="num"><b style="color:var(--pos)">${tp}</b><span>× lief gut</span></div>
    <div class="num"><b style="color:var(--neg)">${tn}</b><span>× besser machen</span></div>
   </div>
   ${db.debriefs===0&&!db.demo?`<div class="hint">Noch keine Debriefs auf diesem Gerät. Zum Anschauen können Sie Beispieldaten laden.</div><button class="btn" data-a="demo">Beispieldaten laden</button>`:""}
   <div class="seg" role="group" aria-label="Sortierung">
    <button data-a="sort" data-s="neg" aria-pressed="${sortMode==="neg"}">Probleme zuerst</button>
    <button data-a="sort" data-s="pos" aria-pressed="${sortMode==="pos"}">Stärken zuerst</button>
    <button data-a="sort" data-s="cat" aria-pressed="${sortMode==="cat"}">Nach Bereich</button>
   </div>
   <div class="legend"><span><i style="background:var(--pos)"></i>lief gut</span><span><i style="background:var(--neg)"></i>besser machen</span></div>
   <div class="bars">${rows.map(r=>`<div class="barrow ${r.p+r.m?"":"zero"}">
     <div class="lbl"><b style="font-weight:500">${r.n} <span class="small">· ${r.g}</span></b><span><span class="p">${r.p}</span> / <span class="n">${r.m}</span></span></div>
     <div class="track" aria-hidden="true"><i class="p" style="width:${r.p/max*100}%"></i><i class="n" style="width:${r.m/max*100}%"></i></div>
    </div>`).join("")}</div>
   ${cats.length?`<div class="card"><h3>Einsatzart (freiwillig erfasst)</h3><ul>${cats.map(c=>`<li>${esc(c)}: ${db.cats[c]}</li>`).join("")}</ul></div>`:""}
   <div class="card"><h3>Lehren</h3>${db.lessons.length?`<ul class="lessons">${db.lessons.map((t,i)=>`<li><p>${esc(t)}</p><button class="x" data-a="dell" data-i="${i}">Löschen</button></li>`).join("")}</ul>`:`<p class="small" style="margin:0">Noch keine gespeichert.</p>`}</div>
   <div class="card"><h3>Export</h3>
    <p class="small" style="margin-top:0">Zum Kopieren in eine Tabelle. Danach können Sie die Zähler zurücksetzen; der Zeitraum ergibt sich aus dem Exportdatum.</p>
    <textarea id="csv" readonly rows="6" style="font-size:13px;font-family:ui-monospace,Menlo,monospace">${esc(csv())}</textarea>
    <div class="two" style="margin-top:10px"><button class="btn" data-a="copy">${ui.copied?"Kopiert":"Kopieren"}</button>
    ${ui.confirmReset?`<button class="btn warn" data-a="reset">Wirklich löschen</button>`:`<button class="btn warn" data-a="askreset">Zurücksetzen</button>`}</div>
   </div>
   <button class="btn ghost" data-a="lock">Auswertung sperren</button></div>`;
}

function vSettings(){
  return `<div class="stack">
   <div class="eyebrow">Einstellungen</div><h2>Für dieses Gerät</h2>
   <div class="card stack" style="gap:10px">
    <label class="check"><input type="checkbox" id="askCat" data-a="askcat" ${db.settings.askCat?"checked":""}> Einsatzart abfragen (freiwillig, überspringbar)</label>
    <p class="small" style="margin:0">Standardmäßig aus. Auf kleinen Wachen kann die Einsatzart einen Einsatz erkennbar machen.</p>
   </div>
   <div class="card stack" style="gap:10px"><h3>PIN für die Auswertung</h3>
    <input type="password" id="newpin" inputmode="numeric" maxlength="8" placeholder="Neue PIN" autocomplete="off" aria-label="Neue PIN">
    ${ui.pinMsg?`<div class="small">${ui.pinMsg}</div>`:""}
    <button class="btn" data-a="setpin">PIN ändern</button>
   </div>
   <button class="btn ghost" data-a="home">Zurück</button></div>`;
}

function render(){
  const V={home:vHome,heavy:vHeavy,flow:vFlow,done:vDone,wall:vWall,rules:vRules,stats:vStats,settings:vSettings};
  app.innerHTML=bar()+(V[view]||vHome)();
  tick();
  const ta=document.getElementById("lesson");
  if(ta)ta.addEventListener("input",()=>{run.lesson=ta.value;const c=document.getElementById("cnt");if(c)c.textContent=ta.value.length});
}
function go(v){view=v;ui={...(v==="stats"?{}:{})};render();window.scrollTo(0,0)}

function tick(){
  if(view!=="flow"||!run)return;
  const left=run.dur-(Date.now()-run.t0)/1000;
  const t=document.getElementById("timer"),p=document.getElementById("prog");
  if(t){t.textContent=fmt(left);t.classList.toggle("over",left<0)}
  if(p)p.style.width=Math.min(100,(1-left/run.dur)*100)+"%";
}
setInterval(tick,500);

function addNote(t,k){
  db.board=db.board||[];
  db.board.splice(Math.floor(Math.random()*(db.board.length+1)),0,{t,k});
  if(k==="lehre")db.lessons.splice(Math.floor(Math.random()*(db.lessons.length+1)),0,t);
}
function finish(){
  run.pos.forEach(id=>{(db.counts[id]=db.counts[id]||{pos:0,neg:0}).pos++});
  run.neg.forEach(id=>{(db.counts[id]=db.counts[id]||{pos:0,neg:0}).neg++});
  db.debriefs++;
  if(run.cat)db.cats[run.cat]=(db.cats[run.cat]||0)+1;
  const l=run.lesson.trim().slice(0,140);
  if(l)addNote(l,run.noteType);
  save();
  const last={p:run.pos.size,n:run.neg.size,l:!!l};
  run=null;unlockScreen();view="done";ui={last};render();window.scrollTo(0,0);
}

function loadDemo(){
  const d={kom:[14,6],fue:[11,4],spk:[2,3],anf:[8,5],lag:[10,2],mat:[6,7],med:[4,1],zei:[3,6],dok:[2,11],lst:[9,8],nef:[11,3],fwp:[6,2],kla:[3,9],zna:[5,12],rmt:[4,2],mue:[0,7],str:[1,4],eig:[3,1]};
  Object.keys(d).forEach(k=>db.counts[k]={pos:d[k][0],neg:d[k][1]});
  db.debriefs=31;db.demo=true;
  db.lessons=["Voranmeldung in der ZNA mit Ankunftszeit und Kernproblem in einem Satz.","Bei unklarer Lage früher Notarzt nachfordern.","Rucksack nach jedem Einsatz sofort auffüllen, nicht erst an der Wache.","Übergabe nach Schema, auch wenn es hektisch ist."];
  save();render();
}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="home"){run=null;unlockScreen();go("home")}
  else if(a==="go"){go(b.dataset.v)}
  else if(a==="start"){run={mode:b.dataset.mode,step:0,pos:new Set(),neg:new Set(),lesson:"",noteType:"lehre",cat:null,help:false,showRules:false,t0:Date.now(),dur:b.dataset.mode==="lang"?300:120};lockScreen();go("flow")}
  else if(a==="help"){run.help=true;render()}
  else if(a==="next"){run.step++;if(run.step>=steps().length)finish();else{render();window.scrollTo(0,0)}}
  else if(a==="back"){run.step=Math.max(0,run.step-1);render();window.scrollTo(0,0)}
  else if(a==="abort"){run=null;unlockScreen();go("home")}
  else if(a==="tag"){const s=b.dataset.mode==="pos"?run.pos:run.neg,id=b.dataset.id;s.has(id)?s.delete(id):s.add(id);b.setAttribute("aria-pressed",s.has(id))}
  else if(a==="cat"){run.cat=run.cat===b.dataset.c?null:b.dataset.c;render()}
  else if(a==="savel"){run.saveLesson=b.checked;const box=document.getElementById("lessonBox");if(box)box.hidden=!b.checked}
  else if(a==="rulesShow"){run.showRules=true;render()}
  else if(a==="finish"){finish()}
  else if(a==="pinok"){const v=(document.getElementById("pin")||{}).value||"";if(v===db.settings.pin){unlocked=true;ui={}}else{ui={pinErr:true}}render()}
  else if(a==="lock"){unlocked=false;go("home")}
  else if(a==="sort"){sortMode=b.dataset.s;render()}
  else if(a==="demo"){loadDemo()}
  else if(a==="dell"){db.lessons.splice(+b.dataset.i,1);save();render()}
  else if(a==="copy"){const t=document.getElementById("csv");const done=()=>{ui.copied=true;render()};
    try{navigator.clipboard.writeText(t.value).then(done).catch(()=>{t.focus();t.select()})}catch(err){t.focus();t.select()}}
  else if(a==="askreset"){ui.confirmReset=true;render()}
  else if(a==="reset"){const s=db.settings,bd=db.board||[];db=blank();db.settings=s;db.board=bd;save();ui={};render()}
  else if(a==="askcat"){db.settings.askCat=b.checked;save()}
  else if(a==="ntype"){run.noteType=b.dataset.t;render()}
  else if(a==="wtype"){ui.wtype=b.dataset.t;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))}
  else if(a==="addw"){const v=((document.getElementById("wnote")||{}).value||"").trim().slice(0,140);if(v){addNote(v,ui.wtype==="lehre"?"lehre":"fzg");save();render()}}
  else if(a==="delb"){db.board.splice(+b.dataset.i,1);save();render()}
  else if(a==="setpin"){const v=((document.getElementById("newpin")||{}).value||"").trim();
    if(/^\d{4,8}$/.test(v)){db.settings.pin=v;save();ui={pinMsg:"PIN geändert."}}else{ui={pinMsg:"Bitte 4 bis 8 Ziffern eingeben."}}render()}
});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pin"){e.preventDefault();app.querySelector('[data-a="pinok"]').click()}});

render();
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
</body>
</html>
